title: Eugene
description: "Learnings and Ideas"
url: "https://eugeneng1150.github.io"
baseurl: ""
github_url: "https://github.com/eugeneng1150"
timezone: Asia/Singapore
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
collections:
  papers:
    output: true
    permalink: /papers/:name/
kramdown:
  input: GFM
  math_engine: mathjax
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
